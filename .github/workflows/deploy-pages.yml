name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: /david-heavern-portfolio/
      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          routes=(
            dashboard/overview
            dashboard/experience
            dashboard/expertise
            dashboard/contact
            dashboard/education
            dashboard/projects/real-time-transaction-monitoring
            dashboard/projects/digital-payments-services
            dashboard/projects/risk-insights-dashboard
            dashboard/projects/care-coordination-portal
            dashboard/projects/clinical-data-exchange
          )
          for route in "${routes[@]}"; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
